<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.sparklink"/>
    <allow send_destination="org.sparklink"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.sparklink"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_interface="org.sparklink.Manager"/>
    <allow send_interface="org.sparklink.Adapter"/>
    <allow send_interface="org.sparklink.Device"/>
    <allow send_interface="org.sparklink.Service"/>
    <allow send_interface="org.sparklink.Characteristic"/>
    <allow send_interface="org.sparklink.AgentManager"/>
  </policy>
</busconfig>
