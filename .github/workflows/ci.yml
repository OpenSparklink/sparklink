name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features

  test:
    name: cargo test
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install private D-Bus regression dependency
        run: sudo apt-get update && sudo apt-get install -y dbus-daemon
      - run: cargo test --workspace --all-features

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -W clippy::all

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  cbindgen:
    name: C header generation
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cbindgen --version 0.29.4 --locked
      - name: Generate sparklink.h
        working-directory: crates/libsparklink
        run: cbindgen --config cbindgen.toml --crate libsparklink --output /tmp/sparklink.h
      - name: Verify header unchanged
        run: diff -u crates/libsparklink/include/sparklink.h /tmp/sparklink.h

  build-release:
    name: release build
    runs-on: ubuntu-24.04
    needs: [test, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: sparklink-binaries
          path: |
            target/release/slkd
            target/release/slkconfig
            target/release/slctl
            target/release/slkmon
            target/release/slkdump
            target/release/liblibsparklink.so
          retention-days: 14

  python-check:
    name: Python bindings and kernel ABI conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out matching canonical kernel UAPI
        uses: actions/checkout@v4
        with:
          repository: OpenSparklink/linux
          # Update this pin together with intentional kernel UAPI changes.
          ref: f1704a2e44dc750e6c325077bb234579f8922b6f
          path: .kernel-uapi
          sparse-checkout: include/uapi/linux/sparklink_ioctl.h
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare 32-bit header compilation and actual cdylib
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          cargo build -p libsparklink --lib
      - run: python -m py_compile bindings/python/sparklink/__init__.py
      - run: python -m py_compile bindings/python/sparklink/structs.py
      - run: python -m py_compile bindings/python/sparklink/adapter.py
      - run: python -m py_compile bindings/python/sparklink/native.py
      - name: Run Python unit and compiled C/Rust ABI tests
        env:
          PYTHONPATH: bindings/python
          SPARKLINK_KERNEL_UAPI: ${{ github.workspace }}/.kernel-uapi/include/uapi/linux/sparklink_ioctl.h
        run: python -m unittest discover -s bindings/python/tests -v

  tooling-test:
    name: WS73 tooling and evidence validation (no hardware)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out matching kernel lab helpers
        uses: actions/checkout@v4
        with:
          repository: OpenSparklink/linux
          ref: f1704a2e44dc750e6c325077bb234579f8922b6f
          path: .kernel-tools
          sparse-checkout: tools/testing/selftests/sparklink
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools/tests -v
        env:
          SPARKLINK_KERNEL_SOURCE: ${{ github.workspace }}/.kernel-tools

  kernel-containment:
    name: Actual kernel security, TX, SSAP and event copy boundaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OpenSparklink/linux
          ref: f1704a2e44dc750e6c325077bb234579f8922b6f
          path: .kernel-containment
          sparse-checkout: |
            net/sparklink
            tools/testing/selftests/sparklink
            include/uapi/linux/sparklink_ioctl.h
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compiler and sanitizer runtimes
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Execute actual source failure boundaries (not RF or crypto vectors)
        working-directory: .kernel-containment
        env:
          CC: clang
        run: |
          python tools/testing/selftests/sparklink/run_security_remediation.py
          python tools/testing/selftests/sparklink/run_backend_containment.py
          python tools/testing/selftests/sparklink/run_connection_tx.py
          python tools/testing/selftests/sparklink/run_ssap_containment.py
          python tools/testing/selftests/sparklink/run_event_copy.py
          python tools/testing/selftests/sparklink/run_phy_model.py
      - name: Compile live VFS probe (not executed without a qualified VM)
        working-directory: .kernel-containment
        run: clang -std=c11 -O2 -Wall -Wextra -Werror tools/testing/selftests/sparklink/sparklink_event_copy_test.c -o /tmp/event-copy-probe
