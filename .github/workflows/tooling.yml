name: Offline tools and application SDK

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'crates/libsparklink/**'
      - 'crates/slkd/**'
      - 'crates/slctl/**'
      - 'crates/slk-channel/**'
      - 'crates/slk-contract/**'
      - 'crates/slk-protocol/**'
      - 'bindings/python/**'
      - 'data/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'project/lab-resource-policy.json'
      - 'project/build-resource-policy.json'
      - '.github/workflows/tooling.yml'
      - '.github/workflows/ci.yml'
  push:
    branches: [master, codex/sparklink-ws73, codex/firmware-evidence-modes, codex/application-discovery-bindings]
    paths:
      - 'tools/**'
      - 'crates/libsparklink/**'
      - 'crates/slkd/**'
      - 'crates/slctl/**'
      - 'crates/slk-channel/**'
      - 'crates/slk-contract/**'
      - 'crates/slk-protocol/**'
      - 'bindings/python/**'
      - 'data/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'project/lab-resource-policy.json'
      - 'project/build-resource-policy.json'
      - '.github/workflows/tooling.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling-test:
    name: WS73 tooling and evidence validation (no hardware)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out matching kernel lab helpers (no driver execution)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: OpenSparklink/linux
          ref: fb31bb43240e1a370e886f9fd2acf0b899619386
          path: .kernel-tools
          sparse-checkout: |
            tools/testing/selftests/sparklink
            include/uapi/linux
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run existing tooling tests, including rejection controls
        env:
          SPARKLINK_KERNEL_SOURCE: ${{ github.workspace }}/.kernel-tools
        run: python3 -m unittest discover -s tools/tests -v
      - name: Check out exact WS73 receive function selftest sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: OpenSparklink/linux
          # Exact query/RX functions; existing UAPI/SDK pins stay independent.
          ref: 883b9c0c19ef7d37f40f6b4b057cd7ca83cde160
          path: .kernel-rx-functions
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            drivers/sparklink/ws73/usb.c
            drivers/sparklink/ws73/wire.c
            drivers/sparklink/ws73/wire.h
            drivers/usb/core/message.c
            tools/testing/selftests/sparklink/run_connection_tx.py
            tools/testing/selftests/sparklink/usb_source_paths.py
            tools/testing/selftests/sparklink/run_ws73_runtime_rx.py
            tools/testing/selftests/sparklink/run_ws73_hcc_memory.py
            tools/testing/selftests/sparklink/ws73-runtime-rx
      - name: Run actual RX functions with detector and mutation controls (no USB)
        working-directory: .kernel-rx-functions
        env:
          CC: clang
        run: |
          clang --version
          python3 tools/testing/selftests/sparklink/run_ws73_runtime_rx.py --output "$RUNNER_TEMP/ws73-runtime-rx.json" --artifacts "$RUNNER_TEMP/ws73-runtime-rx-artifacts"
      - name: Run actual fixed HCC query and exact-response helper (no USB)
        working-directory: .kernel-rx-functions
        env:
          CC: clang
        run: python3 tools/testing/selftests/sparklink/run_ws73_hcc_memory.py --output "$RUNNER_TEMP/ws73-hcc-memory.json" --artifacts "$RUNNER_TEMP/ws73-hcc-memory-artifacts"
      - name: Retain bounded HCC function evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ws73-hcc-memory-offline-functions
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/ws73-hcc-memory.json
            ${{ runner.temp }}/ws73-hcc-memory-artifacts/
      - name: Retain bounded function evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ws73-runtime-rx-offline-functions
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/ws73-runtime-rx.json
            ${{ runner.temp }}/ws73-runtime-rx-artifacts/

  ws73-input-profiles:
    name: WS73 per-device input production functions (no hardware)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the exact profile and boot production sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: OpenSparklink/linux
          # New file-input dependency;existing ABI/RX pins retain their scopes.
          ref: 1e0667dd7b075c1340ca2fa5304e556327611dbe
          path: .kernel-input-profiles
          sparse-checkout: |
            drivers/sparklink/ws73
            tools/testing/selftests/sparklink
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install host fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev
      - name: Run actual codec and boot failure boundaries
        working-directory: .kernel-input-profiles
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tools/testing/selftests/sparklink/ws73_fw_profile_test.c drivers/sparklink/ws73/fw_profile.c -o /tmp/ws73-fw-profile-test
          /tmp/ws73-fw-profile-test
          python3 tools/testing/selftests/sparklink/run_ws73_fw_profile.py

  application-sdk:
    name: Application SDK ABI and private-bus contracts (no hardware)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      SPARKLINK_KERNEL_SOURCE: ${{ github.workspace }}/.kernel-tools
      SPARKLINK_KERNEL_UAPI: ${{ github.workspace }}/.kernel-tools/include/uapi/linux/sparklink_ioctl.h
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: OpenSparklink/linux
          ref: fb31bb43240e1a370e886f9fd2acf0b899619386
          path: .kernel-tools
          sparse-checkout: |
            tools/testing/selftests/sparklink
            include/uapi/linux
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare existing i386 UAPI compile gate
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          cc --version
          dpkg-query -W gcc-multilib linux-libc-dev
      - name: Fixed SDK toolchain and environment
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component clippy --component rustfmt
          rustc +1.96.1 -vV
          python3 --version
          command -v dbus-daemon
          nproc
      - name: Strict application build and actual private-bus consumers
        run: |
          cargo +1.96.1 fmt --all -- --check
          cargo +1.96.1 build --locked --workspace
          cargo +1.96.1 clippy --locked -p slk-contract -p libsparklink -p slkd -p slctl --all-targets --all-features -- -D warnings
          cargo +1.96.1 test --locked -p slk-contract -p libsparklink -p slkd -p slctl --all-features
          python3 tools/check_public_symbols.py --application-library target/debug/liblibsparklink.so --native-library target/debug/libslk_native.so
      - name: Real Python ABI libraries and independent UAPI checks
        env:
          PYTHONPATH: bindings/python
          LIBSPARKLINK_PATH: ${{ runner.temp }}/slk-sdk-libs/libsparklink.so.0
          LIBSLK_NATIVE_PATH: ${{ runner.temp }}/slk-sdk-libs/libslk_native.so.0
          LD_LIBRARY_PATH: ${{ runner.temp }}/slk-sdk-libs
        run: |
          mkdir -p "$RUNNER_TEMP/slk-sdk-libs"
          cp target/debug/liblibsparklink.so "$LIBSPARKLINK_PATH"
          cp target/debug/libslk_native.so "$LIBSLK_NATIVE_PATH"
          python3 -m unittest discover -s bindings/python/tests -v
