# SparkLink Daemon Configuration
# /etc/sparklink/main.conf

[general]
# Default discovery level (0=invisible, 1=general, 2=priority, 3=paired_only, 4=designated)
discovery_level = 1

# Current implementation requires auto_enable=true; false is rejected until
# per-controller enable policy is implemented.
auto_enable = true

# Daemon adapter alias; does not configure the native radio advertisement name.
name = "SparkLink"

[policy]
# Current implementation requires false; true is rejected.
auto_pair = false

# Current implementation requires 0; nonzero enforcement is not implemented
# and is rejected rather than silently ignored.
min_encryption = 0

# Native WS73 discovery defaults retain the qualified request parameters.
# Optional [ws73.defaults] and address-scoped [[ws73.adapters]] overrides are
# documented in docs/WS73_DISCOVERY_POLICY.md. Range validation is not proof
# that firmware or RF supports a chosen policy. Parameters are immutable for
# each registration; changing configuration requires restarting the daemon.
