name: Documentation

on:
  push:
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - 'tools/check_docs.py'
      - 'tools/check_docs_browser.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - 'tools/check_docs.py'
      - 'tools/check_docs_browser.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      check_external:
        description: 'Also check external website links (requires network)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  html:
    name: Strict Sphinx HTML
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.10.3'
          enable-cache: true
      - name: Sync locked documentation dependencies
        run: uv sync --locked --only-group docs
      - name: Build and validate documentation
        run: make docs
      - uses: actions/upload-artifact@v4
        with:
          name: sparklink-documentation
          path: |
            docs/_build/html
            docs/_build/documentation-audit.json
          if-no-files-found: error
          retention-days: 14


  external-links:
    name: Independent external links
    if: github.event_name == 'workflow_dispatch' && inputs.check_external
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.10.3'
      - run: uv sync --locked --only-group docs
      - run: make docs-linkcheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sparklink-external-links
          path: docs/_build/linkcheck
          if-no-files-found: warn
