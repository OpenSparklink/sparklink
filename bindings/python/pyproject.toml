[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparklink"
version = "0.1.0"
description = "Python bindings for libsparklink (SparkLink userspace library)"
requires-python = ">=3.9"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
