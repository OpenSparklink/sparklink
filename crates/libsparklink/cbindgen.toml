language = "C"
include_guard = "SPARKLINK_H"
autogen_warning = "/* This file is auto-generated by cbindgen. Do not edit manually. */"
tab_width = 4
style = "both"
cpp_compat = true
no_includes = true
sys_includes = ["stdint.h"]
after_includes = "#define SPARKLINK_ALIGN(n) __attribute__((aligned(n)))"

[layout]
aligned_n = "SPARKLINK_ALIGN"

[export]
include = ["SECURITY_CAPABILITY_ONLY", "BusType", "SlkAdapter", "CONTROLLER_EVENT_PAYLOAD_MAX", "SNOOP_PAYLOAD_MAX", "LINK_SNAPSHOT_MAX", "LINK_SNAPSHOT_KNOWN", "REGISTRATION_VERSION", "REGISTRATION_PENDING", "REGISTRATION_FAULT", "REGISTRATION_INSTALLED", "REGISTRATION_RETIRING"]

[export.rename]
"SlkAdapter" = "SlkAdapter"

[parse]
parse_deps = true
include = ["slk-protocol"]

[enum]
prefix_with_name = true
