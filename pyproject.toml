[project]
name = "sparklink-documentation"
version = "0.0.0"
description = "Reproducible documentation tooling for SparkLink; not the Python bindings package."
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
docs = [
    "sphinx>=8.2,<10",
    "myst-parser>=4,<6",
    "furo>=2025,<2027",
    "sphinxcontrib-mermaid>=2,<3",
    "sphinx-autobuild>=2025,<2027",
    "jieba>=0.42.1,<0.43",
]

[tool.uv]
package = false

