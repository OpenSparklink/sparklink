# SparkLink Daemon Configuration
# /etc/sparklink/main.conf

[general]
# Default discovery level (0=invisible, 1=general, 2=priority, 3=paired_only, 4=designated)
discovery_level = 1

# Auto power-on at startup
auto_enable = true

# Default device name for advertisements
name = "SparkLink"

[policy]
# Auto-pair with JustWorks when possible
auto_pair = false

# Minimum encryption level required (0=none)
min_encryption = 0
