<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Observe by default. New methods and interface-less calls fail closed.
       Remote reads, destructive dequeue, passkeys and Properties.Set need
       control authorization too; a method name beginning with Get/Read is
       not sufficient to make it safe for observers. -->
  <policy context="default">
    <deny own="org.sparklink"/>
    <deny send_destination="org.sparklink"/>
    <allow send_destination="org.sparklink" send_type="method_return" send_requested_reply="true"/>
    <allow send_destination="org.sparklink" send_type="error" send_requested_reply="true"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.freedesktop.DBus.Peer" send_member="GetMachineId"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.freedesktop.DBus.ObjectManager" send_member="GetManagedObjects"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Manager" send_member="Version"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Manager" send_member="ListAdapters"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Adapter" send_member="GetDevices"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Adapter" send_member="GetReports"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Adapter" send_member="GetTimedReports"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Adapter" send_member="GetDiscoveryResult"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Device" send_member="GetAdvData"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Device" send_member="GetConnectionInfo"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Controller" send_member="GetRole"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Controller" send_member="GetStats"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Controller" send_member="GetEventStats"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Controller" send_member="EventCount"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Controller" send_member="GetPhyInfo"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Controller" send_member="GetPmInfo"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Controller" send_member="AfhGetMap"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Controller" send_member="GetDliInfo"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Controller" send_member="GetMgmtStats"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Controller" send_member="RalSize"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Controller" send_member="MeasReadCap"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Controller" send_member="SyncInfo"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Controller" send_member="ConnCount"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Controller" send_member="UsbDevCount"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.ExtAdv" send_member="GetInfo"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Security" send_member="GetInfo"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.Security" send_member="ListBonded"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.ServiceManager" send_member="GetInfo"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.ServiceManager" send_member="ListServices"/>
    <allow send_destination="org.sparklink" send_type="method_call"
           send_interface="org.sparklink.ServiceManager" send_member="ReadProperty"/>
  </policy>

  <!-- One-time administrator enrollment; slctl itself needs no sudo.
       Group policy follows default policy; root user policy follows groups.
       Neither observers nor control-group members may own the service. -->
  <policy group="sparklink">
    <allow send_destination="org.sparklink" send_type="method_call"/>
  </policy>

  <policy user="root">
    <allow own="org.sparklink"/>
    <allow send_destination="org.sparklink"/>
  </policy>
</busconfig>
