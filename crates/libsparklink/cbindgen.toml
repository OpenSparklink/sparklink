language = "C"
include_guard = "SPARKLINK_H"
autogen_warning = "/* This file is auto-generated by cbindgen. Do not edit manually. */"
tab_width = 4
style = "both"
cpp_compat = true
no_includes = true
sys_includes = ["stdint.h"]
after_includes = "#define SPARKLINK_ALIGN(n) __attribute__((aligned(n)))"

[layout]
aligned_n = "SPARKLINK_ALIGN"

[export]
include = ["SLK_SERVICE_AUTHORIZATION_NONE", "SLK_SERVICE_AUTHORIZATION_REQUESTS", "SSAP_ACCESS_WRITE_ENCRYPTED", "SSAP_ACCESS_WRITE_AUTHENTICATED", "SSAP_ACCESS_WRITE_AUTHORIZED", "SSAP_ACCESS_READ_ENCRYPTED", "SSAP_ACCESS_READ_AUTHENTICATED", "SSAP_ACCESS_READ_AUTHORIZED", "SSAP_ACCESS_VALID_MASK"]

[parse]
parse_deps = true
include = ["slk-protocol"]

[enum]
prefix_with_name = true
