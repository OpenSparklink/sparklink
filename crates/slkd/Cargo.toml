[package]
name = "slkd"
description = "SparkLink daemon - central management service"
version.workspace = true
edition.workspace = true

[[bin]]
name = "slkd"
path = "src/main.rs"

[features]
default = []
# Unqualified legacy kernel-SSAP profile registration; never native WS73.
experimental-legacy-profiles = ["dep:slk-experimental"]

[dependencies]
slk-experimental = { path = "../slk-experimental", optional = true }
anyhow = "1"
slk-protocol = { workspace = true }
libsparklink = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }
nix = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-journald = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
slk-experimental = { path = "../slk-experimental" }
